# ==========================================
# Production Configuration
# Used by Render in production.
# All sensitive values are supplied through
# environment variables.
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# One Render Free instance has 0.1 CPU.  Keep only the connections this
# single-process API can use instead of retaining Hikari's default pool of 10.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=2

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
